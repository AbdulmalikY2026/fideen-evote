<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIDEEN e-Vote</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>FIDEEN e-Vote</h1>

<p>Allah Is Our Strength</p>

<form id="voteForm">

<input
type="text"
id="name"
placeholder="Enter your full name"
required>

<input
type="email"
id="email"
placeholder="Enter your Gmail"
required>

<button type="submit">
Continue to Vote
</button>

</form>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
