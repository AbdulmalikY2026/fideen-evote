<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIDEEN e-Voting</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🗳 FIDEEN e-Voting</h1>

<p>Please login with your Gmail before voting.</p>

<button id="loginBtn">Login with Google</button>

<div id="userInfo" style="display:none;">
    <h3 id="welcome"></h3>

    <h2>Vote for Best Executive</h2>

    <form id="voteForm">

        <label>
            <input type="radio" name="candidate" value="Amir" required>
            Amir
        </label><br>

        <label>
            <input type="radio" name="candidate" value="PRO">
            PRO
        </label><br>

        <label>
            <input type="radio" name="candidate" value="Coordinator">
            Coordinator
        </label><br><br>

        <button type="submit">Submit Vote</button>

    </form>

</div>

<h2>Live Results</h2>

<div id="results"></div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
