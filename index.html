<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIDEEN eVote</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<img src="file_000000006b08720aae07e71ef672adcb.png" alt="FIDEEN Logo" width="120">

<h1>🗳 FIDEEN eVote</h1>

<p>Vote for your preferred candidate.</p>

<form id="voteForm" onsubmit="event.preventDefault(); vote();">

<input type="text" id="name" placeholder="Your Full Name" required>

<input type="email" id="email" placeholder="Your Gmail Address" required>

<h2 id="voteTitle">Election</h2>

<div id="candidateContainer"></div>

<br>

<button type="submit">Submit Vote</button>

</form>

<div id="result"></div>

</div>

<script type="module" src="script.js"></script>

</body>

</html>
